[project]
name = "infoforge"
version = "2.0.0"
description = "Ask questions grounded in local Kiwix ZIM archives with a local LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
infoforge = "infoforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberately narrow: real errors (E4/E7/E9), pyflakes (F), and import order
# (I).  Stylistic rewrites are left out — they turned readable multi-line word
# lists into single 900-character lines.
select = ["E4", "E7", "E9", "F", "I"]
