[project]
name = "infoforge"
version = "2.0.0"
description = "Ask questions grounded in local Kiwix ZIM archives with a local LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
infoforge = "infoforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
