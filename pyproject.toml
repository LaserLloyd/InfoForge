[project]
name = "infoforge"
version = "2.1.0"
description = "Ask questions grounded in local Kiwix ZIM archives with a local LLM."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["kiwix", "zim", "wikipedia", "rag", "mcp", "offline"]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/LaserLloyd/InfoForge"
Changelog = "https://github.com/LaserLloyd/InfoForge/blob/main/CHANGELOG.md"
Security = "https://github.com/LaserLloyd/InfoForge/blob/main/SECURITY.md"

[project.optional-dependencies]
# MCP server (stdio): `infoforge-mcp`.  Optional so the CLI stays two-dependency.
mcp = ["mcp>=1.23,<3"]
# Marker extra for the DisPatch add-on (src/infoforge_dispatch).  The module
# needs nothing beyond the base install; the extra exists so that
# `pip install infoforge[dispatch]` documents intent.
dispatch = []

[project.scripts]
infoforge = "infoforge.cli:main"
infoforge-mcp = "infoforge.mcp_server:main"

[project.entry-points."dispatch.extensions"]
infoforge = "infoforge_dispatch:EXTENSION"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infoforge", "src/infoforge_dispatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Deliberately narrow: real errors (E4/E7/E9), pyflakes (F), and import order
# (I).  Stylistic rewrites are left out — they turned readable multi-line word
# lists into single 900-character lines.
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
# uv caches this project's own built wheel and by default only rebuilds it when
# pyproject.toml/setup.* change; the container builds keep that cache in a persistent
# mount with a non-editable install, so list the sources too (2026-10 review finding).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
